name: Build

# Testa e gera os instaladores:
# - push/PR na main: só testes
# - "Run workflow" manual: testes + AppImage e Windows como artefatos do workflow
# - tag v* (ex.: v0.2.0): testes + rascunho de release com os instaladores anexados
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (usado nos testes) precisa do Node 22.13+
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Testes
        run: npm test

  build:
    needs: testes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc mais antiga, o AppImage roda em mais distribuições
          - plataforma: ubuntu-22.04
            nome: linux
            pacotes: appimage
          - plataforma: windows-latest
            nome: windows
            pacotes: nsis,msi
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file patchelf libfuse2 \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Conferir dependências (Linux)
        if: runner.os == 'Linux'
        run: |
          faltando=""
          for lib in webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 librsvg-2.0 openssl ayatana-appindicator3-0.1; do
            pkg-config --exists "$lib" || faltando="$faltando $lib"
          done
          for bin in file patchelf; do
            command -v "$bin" >/dev/null || faltando="$faltando $bin"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Dependências faltando:$faltando"
            exit 1
          fi
          echo "Todas as dependências de sistema estão instaladas."

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Diagnóstico do Tauri
        run: npx tauri info

      - name: Compilar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.pacotes }}
          # só cria release quando o build vem de uma tag
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Preparador ${{ github.ref_name }}
          releaseBody: |
            Baixe o instalador do seu sistema:
            - **Linux:** arquivo `.AppImage` (dê permissão de execução e abra)
            - **Windows:** `-setup.exe` (recomendado) ou `.msi`

            Como usar: veja a página do projeto.
          releaseDraft: true

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: preparador-${{ matrix.nome }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
